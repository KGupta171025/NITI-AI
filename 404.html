<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to NITI AI</title>
    <meta http-equiv="refresh" content="0; url=https://niti--ai.web.app/" />
    <link rel="canonical" href="https://niti--ai.web.app/" />
    <script>
      (function () {
        var target = "https://niti--ai.web.app";
        var path = window.location.pathname.replace(/^\/NITI-AI\/?/i, "/") || "/";
        if (path.charAt(0) !== "/") path = "/" + path;
        window.location.replace(target + path + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="https://niti--ai.web.app/">NITI AI</a>…
    </p>
  </body>
</html>
